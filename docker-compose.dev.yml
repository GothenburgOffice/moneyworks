# One project name for plain Compose and the devcontainer, so both share the
# same containers and volumes. CI overrides it with COMPOSE_PROJECT_NAME.
name: moneyworks

services:
  web:
    build:
      context: ./web
      dockerfile: ../Dockerfile.dev
    container_name: moneyworks-next-dev
    working_dir: /workspace/web
    command: sh -c "npm ci && npm run db:setup && npm run dev -- --hostname 0.0.0.0"
    # Uncommon host ports so this stack runs beside other local projects.
    ports:
      - "127.0.0.1:${MONEYWORKS_WEB_PORT:-3410}:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      # Development defaults; .env is optional and only needed to override them.
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-moneyworks}}
      - AUTH_BASE_URL=${AUTH_BASE_URL:-http://localhost:${MONEYWORKS_WEB_PORT:-3410}}
      - AUTH_SECRET=${AUTH_SECRET:-}
      - AUTH_PUBLIC_SIGNUP=${AUTH_PUBLIC_SIGNUP:-true}
      - PRIVACY_CONTROLLER_NAME=${PRIVACY_CONTROLLER_NAME:-}
      - PRIVACY_CONTACT_EMAIL=${PRIVACY_CONTACT_EMAIL:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - SMTP_ALLOW_LOCAL_PLAINTEXT=${SMTP_ALLOW_LOCAL_PLAINTEXT:-false}
      - AUTH_TRUSTED_IP_HEADER=${AUTH_TRUSTED_IP_HEADER:-}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/web/node_modules
      - web_next:/workspace/web/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    container_name: moneyworks-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-moneyworks}
    # No host port: the app, migrations and Prisma reach it at db:5432 on the
    # Compose network. Use `docker compose exec db psql` for manual queries.
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres18_data:
  web_node_modules:
  web_next:
