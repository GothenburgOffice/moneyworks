services:
  web:
    build:
      context: ./web
      dockerfile: ../Dockerfile.dev
    container_name: moneyworks-next-dev
    working_dir: /workspace/web
    command: sh -c "npm ci && npm run dev -- --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=${DATABASE_URL:?Copy .env.example to .env first}
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - .:/workspace
      - web_node_modules:/workspace/web/node_modules
      - web_next:/workspace/web/.next
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    container_name: moneyworks-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env first}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres18_data:
  web_node_modules:
  web_next:
