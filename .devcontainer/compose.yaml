# Dev container additions to compose.yaml + compose.dev.yaml. devcontainer.json
# keeps the service command (overrideCommand: false), so the dev server starts
# with the container.
services:
  app:
    environment:
      # Local development only: always allow registering throwaway accounts here,
      # whatever is saved at /admin (as in vocabulary-training). Never set in .env.
      ALLOW_REGISTRATION: "true"
      # Clearly fake privacy details so local registration works; stored in the dev
      # database only while none exist (edit them at /admin). Never read from .env.
      PRIVACY_CONTROLLER_NAME: Local development, not a real operator
      PRIVACY_CONTACT_EMAIL: dev-privacy@example.test
      # Claude Code keeps its sign-in and settings in this volume across rebuilds.
      CLAUDE_CONFIG_DIR: /root/.claude
    volumes:
      - claude-config:/root/.claude
      # Claude Code's project memory lives outside the repo, so `git clean` or a fresh
      # clone never removes it. /workspace maps to the "-workspace" project folder.
      - ${CLAUDE_MEMORY_DIR:-${HOME:-${USERPROFILE}}/.claude-memory/moneyworks}:/root/.claude/projects/-workspace/memory

volumes:
  claude-config:
