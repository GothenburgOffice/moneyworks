  <script>
    (() => {
      const timeline = gsap.timeline({ paused: true });
      const cards = [
        { id: "mw-features-timeline", start: 0, end: 5 },
        { id: "mw-features-pension", start: 5, end: 10 },
        { id: "mw-features-retirement", start: 10, end: 15 },
        { id: "mw-features-savings", start: 15, end: 20 },
      ];

      const part = (card, name) =>
        document.getElementById(card.id).querySelector('[data-part="' + name + '"]');

      cards.forEach((card, index) => {
        const content = part(card, "content");
        const heading = part(card, "heading");
        const stage = part(card, "stage");
        const rule = part(card, "rule");

        // Outer timed clips are host-owned and never receive GSAP transforms.
        // First frame is already a readable feature card, not a blank entrance.
        if (index > 0) {
          timeline.fromTo(
            content,
            { x: 32, opacity: 0.6 },
            { x: 0, opacity: 1, duration: 0.28, ease: "power4.out", immediateRender: false },
            card.start,
          );
        }
        timeline.fromTo(
          heading,
          { y: 16, opacity: 0.7 },
          { y: 0, opacity: 1, duration: 0.44, ease: "power3.out", immediateRender: false },
          card.start,
        );
        timeline.fromTo(
          stage,
          { y: 20, scale: 1.025, opacity: 0.55 },
          { y: 0, scale: 1, opacity: 1, duration: 0.5, ease: "power3.out", immediateRender: false },
          card.start,
        );
        timeline.set(rule, { scaleX: 0 }, card.start);
        timeline.fromTo(
          rule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.34, ease: "power3.out", immediateRender: false },
          card.start + 0.24,
        );

        if (index < cards.length - 1) {
          // Cut-the-curve: matching leftward acceleration and deceleration.
          timeline.fromTo(
            content,
            { x: 0 },
            { x: -32, duration: 0.28, ease: "power4.in", immediateRender: false },
            card.end - 0.28,
          );
          timeline.fromTo(
            content,
            { opacity: 1 },
            { opacity: 0, duration: 0.16, ease: "none", immediateRender: false },
            card.end - 0.16,
          );
        }
      });

      const cta = part(cards[3], "cta");
      timeline.set(cta, { opacity: 0 }, cards[3].start);
      timeline.fromTo(
        cta,
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", immediateRender: false },
        18,
      );

      // Hold the actual final card through the declared endpoint, without an exit.
      timeline.set(part(cards[3], "content"), { opacity: 1, x: 0 }, 20);
      window.__timelines = window.__timelines || {};
      window.__timelines["01-features"] = timeline;
    })();
  </script>
