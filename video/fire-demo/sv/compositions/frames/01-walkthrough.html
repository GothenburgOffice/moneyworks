  <script>
    (() => {
      const timeline = gsap.timeline({ paused: true });

      // Settled full-precision windows from narration-timing.json.
      const scenes = [
        {
          id: "mw-walkthrough-intro",
          start: 0,
          voiceStart: 0.35,
          end: 10.179020336448598,
        },
        {
          id: "mw-walkthrough-timeline",
          start: 10.179020336448598,
          voiceStart: 10.529020336448598,
          end: 20.357012140186917,
        },
        {
          id: "mw-walkthrough-starting-point",
          start: 20.357012140186917,
          voiceStart: 20.70701214018692,
          end: 32.50727164485981,
        },
        {
          id: "mw-walkthrough-pension",
          start: 32.50727164485981,
          voiceStart: 32.857271644859814,
          end: 48.608479317757,
        },
        {
          id: "mw-walkthrough-retirement",
          start: 48.608479317757,
          voiceStart: 48.958479317757,
          end: 64.2723129906542,
        },
        {
          id: "mw-walkthrough-savings",
          start: 64.2723129906542,
          voiceStart: 64.6223129906542,
          end: 79.4449376635514,
        },
        {
          id: "mw-walkthrough-outro",
          start: 79.4449376635514,
          voiceStart: 79.7949376635514,
          end: 90,
        },
      ];

      const part = (scene, name) =>
        document.getElementById(scene.id).querySelector('[data-part="' + name + '"]');

      const reveal = (element, at, distance = 12, duration = 0.55) => {
        timeline.fromTo(
          element,
          { opacity: 0, y: distance },
          { opacity: 1, y: 0, duration, ease: "power3.out", immediateRender: false },
          at,
        );
      };

      scenes.forEach((scene, index) => {
        const content = part(scene, "content");
        const heading = part(scene, "heading");
        const staged = Array.from(
          document
            .getElementById(scene.id)
            .querySelectorAll('[data-part]:not([data-part="content"])'),
        );

        // The host owns timed-clip visibility. All motion stays on inner elements.
        timeline.set(staged, { opacity: 0 }, scene.start);
        timeline.fromTo(
          content,
          { x: index === 0 ? 0 : 18, opacity: 0.5 },
          { x: 0, opacity: 1, duration: 0.32, ease: "power4.out", immediateRender: false },
          scene.start,
        );
        reveal(heading, scene.start + 0.12, 8, 0.5);

        if (index < scenes.length - 1) {
          // A brief internal cut-the-curve seam, followed by a long static read.
          timeline.fromTo(
            content,
            { x: 0 },
            { x: -18, duration: 0.32, ease: "power4.in", immediateRender: false },
            scene.end - 0.32,
          );
          timeline.fromTo(
            content,
            { opacity: 1 },
            { opacity: 0, duration: 0.18, ease: "none", immediateRender: false },
            scene.end - 0.18,
          );
        }
      });

      // Opening and closing use the supplied brand mark, never a rebuilt UI.
      reveal(part(scenes[0], "hero"), scenes[0].start, 6, 0.45);
      reveal(part(scenes[0], "accent"), scenes[0].start + 0.7, 0, 0.4);
      reveal(part(scenes[6], "hero"), scenes[6].start, 6, 0.45);
      reveal(part(scenes[6], "accent"), scenes[6].start + 0.7, 0, 0.4);

      // Actual field crops enter one at a time, then remain still for reading.
      reveal(part(scenes[1], "field-one"), scenes[1].start + 2.85);
      reveal(part(scenes[1], "field-two"), scenes[1].start + 5.15);
      reveal(part(scenes[1], "field-three"), scenes[1].start + 6.85);
      reveal(part(scenes[2], "field-one"), scenes[2].start + 1.0);
      reveal(part(scenes[2], "field-two"), scenes[2].start + 3.3);
      reveal(part(scenes[2], "field-three"), scenes[2].start + 5.4);

      // One pension only: editor, accepted compact row, then Calculate.
      const pensionSave = scenes[3].voiceStart + 5.44;
      reveal(part(scenes[3], "editor"), scenes[3].start);
      timeline.set(part(scenes[3], "editor"), { opacity: 0 }, pensionSave);
      reveal(part(scenes[3], "saved"), pensionSave, 10);
      reveal(part(scenes[3], "calculate"), scenes[3].end - 2.5, 8);

      // Switch on the spoken cue: "The chart then follows".
      const retirementChart = scenes[4].voiceStart + 8.04;
      reveal(part(scenes[4], "answer"), scenes[4].start, 8);
      timeline.set(part(scenes[4], "answer"), { opacity: 0 }, retirementChart);
      reveal(part(scenes[4], "chart"), retirementChart, 10);

      // Preserve page order, but reveal projected / gap / needed in spoken order.
      reveal(part(scenes[5], "toggle"), scenes[5].start, 8);
      reveal(part(scenes[5], "projected"), scenes[5].voiceStart + 2.6, 8);
      reveal(part(scenes[5], "gap"), scenes[5].voiceStart + 6.2, 8);
      reveal(part(scenes[5], "needed"), scenes[5].voiceStart + 8.6, 8);

      // Explicit final readable state, with no dummy tween or fade to black.
      timeline.set(part(scenes[6], "content"), { opacity: 1, x: 0 }, 90);
      window.__timelines = window.__timelines || {};
      window.__timelines["01-walkthrough"] = timeline;
    })();
  </script>
