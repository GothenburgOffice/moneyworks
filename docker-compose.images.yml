# Release stack from a built or published image: no source checkout or Node.
# Requires POSTGRES_PASSWORD in .env. Accounts also need the settings in AUTH.md;
# hosted use needs HTTPS in front (see #11).
name: moneyworks-release

x-database-url: &database-url ${DATABASE_URL:-postgresql://${POSTGRES_USER:-moneyworks}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-moneyworks}}

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneyworks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-moneyworks}
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${MONEYWORKS_IMAGE:-ghcr.io/gothenburgoffice/moneyworks:latest}
    command:
      [
        "node",
        "migrate/node_modules/prisma/build/index.js",
        "migrate",
        "deploy",
        "--config",
        "migrate/prisma.config.ts",
      ]
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  web:
    image: ${MONEYWORKS_IMAGE:-ghcr.io/gothenburgoffice/moneyworks:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MONEYWORKS_WEB_PORT:-3410}:3000"
    environment:
      DATABASE_URL: *database-url
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:${MONEYWORKS_WEB_PORT:-3410}}
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_PUBLIC_SIGNUP: ${AUTH_PUBLIC_SIGNUP:-false}
      PRIVACY_CONTROLLER_NAME: ${PRIVACY_CONTROLLER_NAME:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      AUTH_TRUSTED_IP_HEADER: ${AUTH_TRUSTED_IP_HEADER:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/db').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres18_data:
