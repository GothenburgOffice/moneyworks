# Base stack: production build from source. compose.dev.yaml layers development
# on top; compose.images.yaml runs the published image instead.
# Copy .env.example to .env first; only POSTGRES_PASSWORD is required.
name: moneyworks

x-database-url: &database-url postgresql://moneyworks:${POSTGRES_PASSWORD}@db:5432/moneyworks

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: moneyworks
      POSTGRES_USER: moneyworks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    # No host port: the app, migrations and Prisma reach it at db:5432 on the
    # Compose network. Use `docker compose exec db psql -U moneyworks` for queries.
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyworks -d moneyworks"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: web
      dockerfile: ../Dockerfile
      target: migration
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: web
      dockerfile: ../Dockerfile
      target: production
    restart: unless-stopped
    # Uncommon host port so the stack runs beside other local projects.
    ports:
      - "127.0.0.1:${APP_PORT:-3410}:3000"
    environment:
      DATABASE_URL: *database-url
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:${APP_PORT:-3410}}
      APP_ORIGIN_ALIASES: ${APP_ORIGIN_ALIASES:-}
      ALLOW_REGISTRATION: ${ALLOW_REGISTRATION:-false}
      AUTH_SECRET: ${AUTH_SECRET:-}
      PRIVACY_CONTROLLER_NAME: ${PRIVACY_CONTROLLER_NAME:-}
      PRIVACY_CONTACT_EMAIL: ${PRIVACY_CONTACT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      AUTH_TRUSTED_IP_HEADER: ${AUTH_TRUSTED_IP_HEADER:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres18_data:
