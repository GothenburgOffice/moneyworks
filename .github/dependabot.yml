version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    # Lift these major-version holds once the Next.js lint plugin peers support them.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Types track the oldest supported Node line (22); raise with engines.node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      tailwind:
        patterns: ["tailwindcss", "@tailwindcss/*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    # The dev image stays on the oldest supported Node line; raise with engines.node.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
