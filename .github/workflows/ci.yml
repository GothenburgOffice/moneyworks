name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://postgres:password@localhost:5432/moneyworks
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:validate
      - run: npm run build
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Validate Compose and devcontainer configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.dev.yml -f .devcontainer/docker-compose.yml config --quiet
      - name: Build and start development stack
        run: docker compose -f docker-compose.dev.yml up --build --detach --wait --wait-timeout 180
      - name: Smoke test English and Swedish pages and database access
        run: |
          curl --fail --retry 60 --retry-all-errors --retry-delay 2 --connect-timeout 2 --max-time 15 http://localhost:3000/en
          curl --fail --retry 5 --retry-all-errors --retry-delay 2 --max-time 15 http://localhost:3000/sv
          docker compose -f docker-compose.dev.yml exec -T web npm run db:validate
          docker compose -f docker-compose.dev.yml exec -T web sh -c 'printf "SELECT 1;" | npx prisma db execute --stdin'
      - name: Container logs
        if: failure()
        run: docker compose -f docker-compose.dev.yml logs
      - name: Stop test stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down --volumes
