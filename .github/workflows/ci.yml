name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Superseded pull request runs are cancelled; main runs finish so every merge
# gets its release image.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Node 22 is the oldest supported line and matches the dev and release images.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      auth-test-db:
        image: postgres:18.6
        env:
          POSTGRES_USER: moneyworks
          POSTGRES_PASSWORD: password
          POSTGRES_DB: moneyworks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U moneyworks -d moneyworks"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: web
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://moneyworks:password@localhost:5432/moneyworks
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@12.2.1
      - run: npm ci
      - run: npm run test:line-endings
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:ui
      - run: npm run test:architecture
      - run: npm run test:fire
      - run: npm run test:auth-config
      - run: npm run typecheck
      - run: npm run db:validate
      - run: npm run build
      - name: Apply migrations to disposable account test database
        run: npm run db:deploy
      - name: Verify account lifecycle with capture-only SMTP
        env:
          AUTH_TEST_DATABASE_URL: postgresql://moneyworks:password@localhost:5432/moneyworks
        run: npm run test:accounts
      - run: npm audit --audit-level=high

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: moneyworks-ci
      # The development stack: compose.yaml with the compose.dev.yaml override.
      COMPOSE_FILE: compose.yaml:compose.dev.yaml
      BASE_URL: http://localhost:3410
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Exercise Windows-style Git checkout settings
        run: git -c core.autocrlf=true checkout-index --force --all
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Validate Compose and devcontainer configuration
        run: |
          # Every stack requires a .env with POSTGRES_PASSWORD.
          ! docker compose config --quiet 2>/dev/null
          cp .env.example .env
          docker compose -f compose.yaml config --quiet
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.dev.yaml -f .devcontainer/compose.yaml config --quiet
          docker compose -f compose.images.yaml config --quiet
      - name: Build and start development stack
        run: docker compose up --build --detach --wait --wait-timeout 240
      - name: Smoke test English and Swedish pages and database access
        run: |
          curl --fail --silent --show-error --retry 60 --retry-all-errors --retry-delay 2 --connect-timeout 2 --max-time 15 "$BASE_URL/api/health" | grep -F '"status":"ok"'
          docker compose exec -T app npm run test:smoke
          docker compose exec -T app npm run db:validate
          docker compose exec -T app sh -c 'printf "SELECT 1;" | npx prisma db execute --stdin'
      - name: Verify live database reads independently of the fixed page heading
        run: |
          docker compose exec -T db psql -U moneyworks -d moneyworks -c "UPDATE \"Greeting\" SET message = 'CI database greeting changed' WHERE locale = 'en';"
          curl --fail --silent --show-error "$BASE_URL/api/health" | grep -F '"message":"CI database greeting changed"'
          docker compose exec -T app npm run test:smoke
      - name: Verify database failures are visible and not cached
        run: |
          docker compose stop db
          test "$(curl --silent --show-error --max-time 20 --output /tmp/db-health.json --write-out '%{http_code}' "$BASE_URL/api/health")" = 503
          grep -F '"status":"error"' /tmp/db-health.json
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/en" | grep -F '>A clearer view</span>'
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/sv" | grep -F '>En tydligare bild</span>'
          docker compose exec -T -e EXPECTED_DB_STATUS=unavailable app npm run test:db-status
          docker compose start db
          curl --fail --silent --show-error --retry 20 --retry-all-errors --retry-delay 2 --max-time 15 "$BASE_URL/api/health" | grep -F '"status":"ok"'
          docker compose exec -T app npm run test:smoke
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Remove disposable test containers, volumes, network and app image
        if: always()
        run: |
          if test -f compose.yaml; then
            docker compose --env-file .env.example down --volumes --remove-orphans --rmi local
            test -z "$(docker ps --all --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
            test -z "$(docker volume ls --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
            test -z "$(docker network ls --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
          fi

  # Builds the release image once, tests that exact image without source
  # mounts, and on main publishes it to GHCR.
  release:
    name: release image
    needs: [unit, containers]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: release-image-${{ github.repository }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_PROJECT_NAME: moneyworks-release-ci
      COMPOSE_FILE: compose.images.yaml
      MONEYWORKS_IMAGE: moneyworks:release-candidate
      POSTGRES_PASSWORD: ci-only-disposable-image-test-password
      BASE_URL: http://127.0.0.1:3410
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22.23.4
      - name: Build release candidate
        run: docker build --file Dockerfile --target production --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "$MONEYWORKS_IMAGE" web
      - name: Start image-only stack (migrations run from the image)
        run: docker compose up --detach --wait --wait-timeout 180
      - name: Smoke test pages, health and database status
        working-directory: web
        run: TEST_BASE_URL="$BASE_URL" npm run test:smoke
      - name: Verify non-root runtime without source and the auth cleanup command
        run: |
          test "$(docker compose exec -T app id -u)" != 0
          docker compose exec -T app test ! -e /app/src
          docker compose run --rm --no-deps -T app node scripts/cleanup-auth.mjs
      - name: Verify data persists across restart
        run: |
          docker compose exec -T db psql -U moneyworks -d moneyworks -c "UPDATE \"Greeting\" SET message = 'Release image restart check' WHERE locale = 'en';"
          docker compose restart db app
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 --max-time 15 "$BASE_URL/api/health" | grep -F '"message":"Release image restart check"'
      - name: Sign in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the exact tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag "$MONEYWORKS_IMAGE" "$image:sha-$GITHUB_SHA"
          docker push "$image:sha-$GITHUB_SHA"
          docker tag "$MONEYWORKS_IMAGE" "$image:latest"
          docker push "$image:latest"
          echo "PUBLISHED_IMAGE=$image:sha-$GITHUB_SHA" >> "$GITHUB_ENV"
          {
            echo '### Published image'
            echo "\`$image:sha-$GITHUB_SHA\`"
            echo 'This exact linux/amd64 image passed the image-only stack, smoke, runtime and restart checks before publishing.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Verify anonymous pull
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/anonymous-docker"
          if ! docker --config "$RUNNER_TEMP/anonymous-docker" pull "$PUBLISHED_IMAGE"; then
            echo "::error::The image was pushed but cannot be pulled anonymously. After the first publication, set the GHCR package visibility to public in the package settings, then rerun this job."
            exit 1
          fi
      - name: Container logs
        if: failure()
        run: docker compose logs --tail=200
      - name: Remove disposable image-test containers and volumes
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          test -z "$(docker volume ls --quiet --filter "label=com.docker.compose.project=$COMPOSE_PROJECT_NAME")"
